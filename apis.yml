aid: doczen
name: Doczen
description: >-
  Doczen is an enterprise AI transformation platform that connects business
  signals to actionable outcomes, helping large organizations adopt AI in days
  rather than months. The product uses AI agents to interview employees and
  aggregate signals from communication and productivity tools to surface
  operational issues, then ranks the resulting opportunities by financial
  impact, ROI, feasibility, and urgency. It guides implementation through
  buy-vs-build decisions and vendor recommendations, and runs a continuous
  monitoring loop that tracks progress and measures business impact. Doczen
  targets enterprises across financial services, healthcare, manufacturing,
  energy, technology, and transportation and logistics, and integrates with
  hundreds of tools. It advertises an enterprise security and compliance
  posture (ISO 27001, SOC 2, GDPR, EU AI Act) via a Vanta-hosted trust center.
  Doczen is backed by Seedcamp and was added to the API Evangelist network from
  the Seedcamp portfolio; it currently exposes no public developer API.
